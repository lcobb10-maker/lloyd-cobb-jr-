name: Portfolio publication guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  disclosure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify inventory, disclosures and evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import subprocess
          expected = {'.github/workflows/portfolio-disclosure.yml', 'CASE-STUDIES.md', 'PUBLICATION-POLICY.md', 'README.md', 'EVIDENCE.json', 'examples/test_reconciliation.py'}
          actual = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          patterns = [
              r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
              r'\b(?:AKIA|ASIA)[A-Z0-9]{16}\b',
              r'\bgh[pousr]_[A-Za-z0-9]{30,}\b',
              r'\bgithub_pat_[A-Za-z0-9_]{30,}\b',
              r'\bsk-(?:proj-)?[A-Za-z0-9_-]{30,}\b',
              r'\bshpat_[a-fA-F0-9]{32}\b',
              r'/(?:home/ubuntu|opt/|root/|var/www/)',
              r'\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b',
          ]
          def flagged(text):
              return any(re.search(pattern, text) for pattern in patterns)
          assert flagged('ghp_' + 'X' * 36)
          assert flagged('/home/' + 'ubuntu/example')
          assert not flagged('Reported first paint: 400 ms.')
          assert actual == expected, 'Unexpected public file inventory'
          for name in sorted(expected - {'.github/workflows/portfolio-disclosure.yml'}):
              text = pathlib.Path(name).read_text(encoding='utf-8')
              assert not flagged(text), 'Potential disclosure in ' + name
              if name.endswith('.md'):
                  for link in re.findall(r'\]\(\./([^\s)#]+)(?:#[^)]*)?\)', text):
                      assert link in expected, 'Unapproved relative link in ' + name
          records = json.loads(pathlib.Path('EVIDENCE.json').read_text())['records']
          by_type = {r['type']: r for r in records}
          assert by_type['demo_release_checks']['passed'] == 11
          assert by_type['prototype_unit_tests']['passed'] == 17
          assert by_type['role_automation']['independent_model_agents'] == 0
          perf = by_type['lab_first_paint']
          assert round(100 * (1 - perf['candidate_median_ms'] / perf['baseline_median_ms']), 1) == 32.4
          print('Inventory, basic disclosure screen and evidence consistency passed.')
          PY
      - name: Run synthetic evidence example
        run: python3 -B -m unittest discover -s examples -p 'test_*.py' -v
