name: Portfolio publication guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  disclosure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify permitted files and detect common disclosure indicators
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          expected = {'.github/workflows/portfolio-disclosure.yml', 'CASE-STUDIES.md', 'PUBLICATION-POLICY.md', 'README.md'}
          actual = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          patterns = [
              r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
              r'\b(?:AKIA|ASIA)[A-Z0-9]{16}\b',
              r'\bgh[pousr]_[A-Za-z0-9]{30,}\b',
              r'\bgithub_pat_[A-Za-z0-9_]{30,}\b',
              r'\bsk-(?:proj-)?[A-Za-z0-9_-]{30,}\b',
              r'\bshpat_[a-fA-F0-9]{32}\b',
              r'/(?:home/ubuntu|opt/|root/|var/www/)',
              r'\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b',
          ]
          def flagged(text):
              return any(re.search(pattern, text) for pattern in patterns)
          # Synthetic self-tests; never print matched content.
          assert flagged('ghp_' + 'X' * 36)
          assert flagged('/home/' + 'ubuntu/example')
          assert not flagged('Reported first paint: 400 ms.')
          assert actual == expected, 'Unexpected public file inventory'
          for name in sorted(expected - {'.github/workflows/portfolio-disclosure.yml'}):
              if flagged(pathlib.Path(name).read_text(encoding='utf-8')):
                  raise SystemExit('Potential disclosure in approved document: ' + name)
          print('Allowed file inventory and basic content checks passed.')
          PY
